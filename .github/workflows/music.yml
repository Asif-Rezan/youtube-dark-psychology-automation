name: Hindi vocal audio preview
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Audio preview identifier
        required: true
        type: string
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ACESTEP_SOURCE_DIR: ${{ github.workspace }}/.vendor/ace-step
      ACESTEP_CHECKPOINTS_DIR: .models/acestep
      ACESTEP_INIT_LLM: 'false'
      ACESTEP_GENERATION_TIMEOUT: '18000'
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ace-step/ACE-Step-1.5
          ref: ca1e85fe9430179831e6bc6be790c332190a3866
          path: .vendor/ace-step
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Prepare CPU runner memory and audio tools
        timeout-minutes: 10
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          bash scripts/install-runner-packages.sh ffmpeg libsndfile1
          sudo fallocate -l 16G /swapfile-music
          sudo chmod 600 /swapfile-music
          sudo mkswap /swapfile-music
          sudo swapon /swapfile-music
          free -h
          df -h .
      - name: Install CPU-only music inference runtime
        run: |
          pip install --no-cache-dir torch==2.10.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt -r requirements-music-cpu.txt
      - name: Verify pinned ACE-Step CPU imports
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from music_cpu import runtime
          torch, handler, params, config, infer = runtime(Path(os.environ['ACESTEP_SOURCE_DIR']))
          assert not torch.cuda.is_available()
          print('Pinned ACE-Step CPU runtime imported successfully')
          PY
      - name: Generate 30-second Hindi vocal preview only
        run: |
          mkdir -p output/preview
          python -u - <<'PYCODE'
          import json, os
          from pathlib import Path
          from music_cpu import synthesize
          from kids_rhymes import REFRAIN
          lyrics = '\n'.join([
              'नन्हे बच्चे बगीचे में नाचें', REFRAIN,
              'प्यारी चिड़िया मीठे गीत सुनाए', REFRAIN,
              'छोटे खरगोश खुशी से ताली बजाएं', REFRAIN,
          ])
          song = dict(_segment=True, vocal_language='hi', vocal_gender='female',
              duration=30, bpm=120, lyrics=lyrics,
              prompt='Joyful nursery rhyme, cute sweet adult female singing voice, clear Hindi diction, playful dudi dudi dam dam refrain, C major, 120 BPM, bouncy ukulele, bright xylophone, steady handclaps and gentle bass. Continuous lively instrumental backing under every vocal line, no silent breaks, no stop-start pauses, no shouting.')
          root = Path('output/preview')
          (root/'song.json').write_text(json.dumps(song,ensure_ascii=False,indent=2))
          synthesize(song, root/'hindi-preview.wav', Path(os.environ['ACESTEP_SOURCE_DIR']), Path(os.environ['ACESTEP_CHECKPOINTS_DIR']))
          PYCODE
          ffmpeg -y -v error -i output/preview/hindi-preview.wav -af loudnorm=I=-16:TP=-1.5:LRA=11 -codec:a libmp3lame -b:a 192k output/preview/hindi-preview.mp3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hindi-vocal-preview
          path: output/preview/
          retention-days: 7
