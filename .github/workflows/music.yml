name: Hindi vocal audio preview
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Audio preview identifier
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hindi-vocal-preview
  cancel-in-progress: true
jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        style: [continuous-60]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ACESTEP_SOURCE_DIR: ${{ github.workspace }}/.vendor/ace-step
      ACESTEP_CHECKPOINTS_DIR: .models/acestep
      ACESTEP_INIT_LLM: 'false'
      ACESTEP_GENERATION_TIMEOUT: '18000'
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ace-step/ACE-Step-1.5
          ref: ca1e85fe9430179831e6bc6be790c332190a3866
          path: .vendor/ace-step
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare CPU runner memory and audio tools
        timeout-minutes: 10
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          bash scripts/install-runner-packages.sh ffmpeg libsndfile1
          sudo fallocate -l 16G /swapfile-music
          sudo chmod 600 /swapfile-music
          sudo mkswap /swapfile-music
          sudo swapon /swapfile-music
          free -h
          df -h .
      - name: Validate full-length cover reference before installing models
        run: |
          python - <<'PYREF'
          import json, subprocess
          result = subprocess.check_output(['ffprobe', '-v', 'error', '-show_entries',
              'format=duration', '-of', 'json', 'assets/reference/style-reference.mp3'], text=True)
          seconds = float(json.loads(result)['format']['duration'])
          if seconds < 59.95:
              raise SystemExit(f'A 60s source-conditioned cover requires a >=60s reference; got {seconds:.2f}s. No splicing or style-only fallback.')
          PYREF
      - name: Install CPU-only music inference runtime
        run: |
          pip install --no-cache-dir torch==2.10.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt -r requirements-music-cpu.txt
      - name: Verify pinned ACE-Step CPU imports
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from music_cpu import runtime
          torch, handler, params, config, infer = runtime(Path(os.environ['ACESTEP_SOURCE_DIR']))
          assert not torch.cuda.is_available()
          print('Pinned ACE-Step CPU runtime imported successfully')
          PY
      - name: Generate improved Hindi kids vocal preview
        env:
          PREVIEW_STYLE: ${{ matrix.style }}
          PREVIEW_RUN_ID: ${{ inputs.run_id }}
        run: python -u preview_kids_audio.py --style "$PREVIEW_STYLE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hindi-reference-${{ matrix.style }}
          path: output/preview/
          retention-days: 7
