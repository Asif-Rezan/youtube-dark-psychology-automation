name: Prehistoric human life documentary
on:
  push:
    branches: [main]
    paths: [.generation/scene-story-request.json]
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional stable run ID for resuming an existing episode
        type: string
      upload_mode:
        description: YouTube publication mode
        type: choice
        default: public
        options: [public, scheduled]
      publish_at:
        description: Optional ISO 8601 timestamp for scheduled publication
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: dudi-dam-tv-publish
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '4'
  HF_HUB_DISABLE_XET: '1'
jobs:
  plan:
    name: Generate original idea and narration with Qwen
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      run_id: ${{ steps.identity.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: identity
        env:
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          run_id="${REQUESTED_RUN_ID:-prehistory-$GITHUB_RUN_ID}"
          [[ "$run_id" =~ ^prehistory-[A-Za-z0-9_-]{1,69}$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Install the pinned Qwen runtime and run tests
        run: |
          python install_lyrics_dependencies.py
          python -m unittest discover
      - uses: ./.github/actions/model-cache
        with:
          family: lyrics
      - name: Validate destinations and checkpoint the story
        env:
          RUN_ID: ${{ steps.identity.outputs.run_id }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          FACEBOOK_PUBLISH_ENABLED: ${{ vars.FACEBOOK_PUBLISH_ENABLED }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID || 'UCYjz7d66SsshimfpxZahlhQ' }}
        run: |
          python validate_publication_config.py
          python -u -m prehistory.production plan --run-id "$RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: prehistoric-plan
          path: output/*/prehistory-plan.json
          if-no-files-found: error
          retention-days: 7
  render:
    name: Narrate and render Python animation and thumbnail
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      RUN_ID: ${{ needs.plan.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          bash scripts/install-runner-packages.sh ffmpeg espeak-ng fonts-dejavu-core
          pip install -r requirements.txt
          pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-prehistory.txt
      - uses: actions/download-artifact@v4
        with:
          name: prehistoric-plan
          path: output/
      - run: python -u -m prehistory.production render --run-id "$RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          # Existing Facebook and YouTube recovery jobs expect this artifact key.
          name: kids-video-${{ github.run_id }}
          path: |
            output/*/prehistory-plan.json
            output/*/prehistory-render.json
            output/*/video.mp4
            output/*/thumbnail.jpg
            output/*/song.json
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Back up and publish on YouTube
    if: vars.PUBLISH_ENABLED == 'true'
    needs: [plan, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUN_ID: ${{ needs.plan.outputs.run_id }}
      UPLOAD_MODE: ${{ inputs.upload_mode || 'public' }}
      PUBLISH_AT: ${{ inputs.publish_at }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID || 'UCYjz7d66SsshimfpxZahlhQ' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: kids-video-${{ github.run_id }}
          path: output/
      - run: python -u -m prehistory.production publish --run-id "$RUN_ID"
  facebook:
    name: Publish the episode on Facebook
    needs: [plan, publish]
    if: vars.FACEBOOK_PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/facebook.yml
    with:
      source_run: ${{ format('{0}', github.run_id) }}
      run_id: ${{ needs.plan.outputs.run_id }}
      kind: video
      non_blocking: true
    secrets: inherit
  cleanup:
    name: Clean verified public media from Drive
    needs: [plan, publish, facebook]
    if: ${{ always() && !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: dudi-drive-cleanup
      cancel-in-progress: false
    env:
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID || 'UCYjz7d66SsshimfpxZahlhQ' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -u cleanup_drive.py --sweep
