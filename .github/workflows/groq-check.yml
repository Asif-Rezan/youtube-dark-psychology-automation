name: Groq authorization check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/groq-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check existing Actions secret without printing it
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_FALLBACK: ${{ secrets.GROQ_API_KEY_FALLBACK }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          key = os.getenv('GROQ_API_KEY', '')
          if not key:
              print(json.dumps({'groq_configured': False, 'groq_authorized': False}))
          else:
              request = urllib.request.Request('https://api.groq.com/openai/v1/models',
                  headers={'Authorization': 'Bearer '+key, 'User-Agent': 'YoutubeAutomation/1.0'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      ids = {m['id'] for m in json.load(response).get('data', [])}
                  print(json.dumps({'groq_configured': True, 'groq_authorized': True,
                      'story_model_available': 'llama-3.3-70b-versatile' in ids}))
              except urllib.error.HTTPError as error:
                  print(json.dumps({'groq_configured': True, 'groq_authorized': False, 'http_status': error.code}))
                  raise SystemExit(1)
