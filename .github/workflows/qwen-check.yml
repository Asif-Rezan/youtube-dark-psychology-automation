name: Local Qwen3-4B-Instruct-2507 generation check
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validation scope'
        type: choice
        options: [full-story, packaging-only]
        default: full-story
permissions:
  contents: read
jobs:
  qwen:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TEXT_BACKEND: qwen-local
      STORY_MODEL: Qwen/Qwen3-4B-Instruct-2507
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install local text dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt -r requirements-story.txt
      - name: Cache the pinned public Qwen weights
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/huggingface/hub/models--unsloth--Qwen3-4B-Instruct-2507-GGUF
          key: qwen3-4b-instruct2507-q4km-a06e946bb6b655725eafa393f4a9745d460374c9
      - name: Validate Qwen storyboard, word limits and selected scope
        run: python -u qwen_check.py --${{ inputs.mode || 'full-story' }}
      - name: Report runner resources after a failure
        if: failure()
        run: |
          free -h
          df -h
