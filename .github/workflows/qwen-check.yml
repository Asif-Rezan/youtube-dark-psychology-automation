name: Local Qwen3.5-9B generation check
on:
  workflow_dispatch:
  push:
    branches: [feat/qwen35-local]
permissions:
  contents: read
jobs:
  qwen:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TEXT_BACKEND: qwen-local
      STORY_MODEL: Qwen/Qwen3.5-9B
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install local text dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev
          pip install -r requirements.txt
      - name: Cache the pinned public Qwen weights
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/huggingface/hub/models--unsloth--Qwen3.5-9B-GGUF
          key: qwen35-9b-q4km-3885219b6810b007914f3a7950a8d1b469d598a5
      - name: Start pinned Qwen3.5-9B CPU model
        run: bash setup_qwen.sh
      - name: Generate and validate eight structured storyboard prompts
        run: python qwen_check.py --full-story
      - name: Report server failure without exposing unpublished text
        if: failure()
        run: |
          free -h
          df -h
          test ! -f "$RUNNER_TEMP/rezan-qwen-server.log" || tail -n 30 "$RUNNER_TEMP/rezan-qwen-server.log"
