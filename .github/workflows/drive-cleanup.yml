name: Resume verified private video cleanup
on:
  workflow_dispatch:
    inputs:
      cleanup_run:
        description: Completed daily run ID to verify and clean; never generates or uploads video
        type: string
        required: true
        default: daily-38644830219
  push:
    branches: [main]
    paths: ['.github/workflows/drive-cleanup.yml']
permissions:
  contents: read
concurrency:
  group: youtube-daily-dark-psychology
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify existing private upload and resume cleanup by file ID
        env:
          SAVED_RUN_ID: ${{ inputs.cleanup_run || 'daily-38644830219' }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          EXPECTED_CHANNEL_ID: UCYjz7d66SsshimfpxZahlhQ
        run: python -u daily_publish.py
