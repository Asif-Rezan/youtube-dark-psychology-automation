name: Manually clean verified project Drive media
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read-only eligibility audit without deletion
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  group: dudi-drive-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID || 'UCYjz7d66SsshimfpxZahlhQ' }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify YouTube status and clean only completed public HD episodes
        env:
          CLEANUP_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          args=(--sweep)
          if [[ "$CLEANUP_DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python -u cleanup_drive.py "${args[@]}"
      - name: Inventory this project root and private kids folder
        if: always()
        run: |
          python - <<'PYINVENTORY'
          import json, os
          from pathlib import Path
          from storage import Store, drive_retry
          store=Store()
          report={}
          for label,folder in dict(project_root=os.environ['DRIVE_FOLDER_ID'],kids_folder=store.folder).items():
              files=[];token=None
              while True:
                  page=drive_retry(lambda:store.client.files().list(q=f"'{folder}' in parents",
                      pageSize=1000,pageToken=token,
                      fields='nextPageToken,files(id,name,mimeType,size,trashed,appProperties)').execute())
                  files.extend(page.get('files',[]))
                  token=page.get('nextPageToken')
                  if not token:break
              report[label]={'files':files,'bytes':sum(int(f.get('size',0)) for f in files)}
          Path('output').mkdir(exist_ok=True)
          Path('output/project-drive-inventory.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({k:{'file_count':len(v['files']),'bytes':v['bytes']} for k,v in report.items()}))
          PYINVENTORY
      - name: Summarize storage and cleanup result
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('output/drive-cleanup-report.json')
          if not path.exists():
              raise SystemExit('Cleanup stopped before a report was written; inspect the preceding error')
          report=json.loads(path.read_text())
          quota=report.get('quota_after',{})
          usage=int(quota.get('usage',0));limit=int(quota.get('limit',0))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('### Verified Drive media cleanup\n')
              summary.write(f"Cleaned episodes: {len(report['cleaned'])}; scheduled/private preserved: {len(report['pending'])}; preserved for review: {len(report.get('review',[]))}; failed API/cleanup operations: {len(report['failed'])}.\n\n")
              summary.write(f'Account storage: {usage/1024**3:.2f} GiB used of {limit/1024**3:.2f} GiB.\n')
          if limit and usage/limit>.9:
              print('::warning::Drive account storage exceeds 90%; pending/unverified media was retained. Review the cleanup report.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-cleanup-report-${{ github.run_id }}
          path: |
            output/drive-cleanup-report.json
            output/project-drive-inventory.json
          retention-days: 14
