name: Recover existing Shorts publication
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Failed workflow containing short-publication checkpoint
        required: true
        type: string
      run_id:
        description: Original song run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: dudi-dam-tv-shorts
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SONG_RUN_ID: ${{ inputs.run_id }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: short-publication-${{ inputs.source_run }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: recovery/
      - name: Resume the existing video without generating or uploading again
        run: python -u recover_short.py --run-id "$SONG_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-recovery-${{ github.run_id }}
          path: recovery/**/*.json
          retention-days: 7
