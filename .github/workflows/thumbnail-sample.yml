name: Review a varied thumbnail
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Existing generation run with saved song lyrics
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: dudi-thumbnail-preview
  cancel-in-progress: false
jobs:
  thumbnail:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '3'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare CPU image memory
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo fallocate -l 12G /swapfile-images
          sudo chmod 600 /swapfile-images
          sudo mkswap /swapfile-images
          sudo swapon /swapfile-images
      - name: Install production image runtime
        run: |
          pip install --no-cache-dir torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt -r requirements-images-cpu.txt
      - name: Test thumbnail diversity rules
        run: python -m unittest test_thumbnail_variety test_thumbnail_reference test_thumbnail_resolution -v
      - uses: actions/download-artifact@v4
        with:
          name: music-input-${{ inputs.source_run }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: preview-source/
      - name: Generate one review thumbnail without publishing
        env:
          THUMBNAIL_IMAGE_WIDTH: '1024'
          THUMBNAIL_IMAGE_HEIGHT: '576'
          THUMBNAIL_IMAGE_STEPS: '16'
        run: python -u preview_thumbnail.py --source preview-source --output output/thumbnail-preview
      - uses: actions/upload-artifact@v4
        with:
          name: thumbnail-preview
          path: output/thumbnail-preview/
          if-no-files-found: error
          retention-days: 7
