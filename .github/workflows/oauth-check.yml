name: Google OAuth check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google API client
        run: pip install -r requirements.txt
      - name: Verify tokens without publishing or modifying files
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          EXPECTED_CHANNEL_ID: UCYjz7d66SsshimfpxZahlhQ
          REQUIRE_PUBLIC_PUBLISH: 'false'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python oauth_check.py
