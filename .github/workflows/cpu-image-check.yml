name: Free CPU image generation check
on:
  push:
    branches: [main]
    paths:
      - image_cpu.py
      - requirements-cpu.txt
      - .github/workflows/cpu-image-check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpu-image-check
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only libraries
        run: |
          pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-cpu.txt
      - name: Generate an image without API credentials
        env:
          CPU_IMAGE_STEPS: '10'
        run: |
          python image_cpu.py --prompt 'Historical documentary reconstruction of the Great Pyramid of Giza and surrounding ancient Egyptian stonework at sunrise, realistic limestone texture, archaeologically grounded landscape, no text.' --output output/cpu-check.png
          python - <<'PY'
          from PIL import Image
          from scene_check import check_scene
          image = Image.open('output/cpu-check.png')
          assert image.size == (1024, 576)
          assert image.convert('L').getextrema()[1] > 0
          scene = check_scene('output/cpu-check.png', {'focus': 'object', 'semantic_target': 'The Great Pyramid of Giza rises above ancient Egyptian limestone structures in a desert landscape'})
          print({'actual_image_size': image.size, 'scene_match': scene})
          assert scene['passed'], 'Generated image did not match the requested historical scene'
          PY
      - name: Save generated historical test image for visual review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-image-check
          path: output/cpu-check.png
          retention-days: 1
          if-no-files-found: error
