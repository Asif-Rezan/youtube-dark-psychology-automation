name: Free CPU image generation check
on:
  push:
    branches: [main]
    paths:
      - image_cpu.py
      - requirements-cpu.txt
      - .github/workflows/cpu-image-check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpu-image-check
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only libraries
        run: |
          pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-cpu.txt
      - name: Generate an image without API credentials
        env:
          CPU_IMAGE_STEPS: '10'
        run: |
          python image_cpu.py --prompt 'An elderly wizard with a long silver beard, weathered face, dark pointed hood and embroidered brown robe raises a wooden staff topped by a glowing amber orb while searching a misty forest, cinematic fantasy illustration, dramatic lighting, deep blue-gray shadows, warm orb light, landscape 16:9, no text' --output output/cpu-check.png
          python - <<'PY'
          from PIL import Image
          from scene_check import check_scene
          image = Image.open('output/cpu-check.png')
          assert image.size == (1024, 576)
          assert image.convert('L').getextrema()[1] > 0
          scene = check_scene('output/cpu-check.png', {'focus': 'person', 'semantic_target': 'An elderly wizard raises a glowing amber orb on his staff while searching a misty forest'})
          print({'actual_image_size': image.size, 'scene_match': scene})
          assert scene['passed'], 'Generated image did not match the requested wizard action'
          PY
# Generated images stay on the temporary runner, with no public artifacts.
# This verifies execution, not cinematic quality or character consistency.
