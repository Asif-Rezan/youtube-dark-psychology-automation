name: Free CPU image generation check
on:
  push:
    branches: [main]
    paths:
      - image_cpu.py
      - requirements-cpu.txt
      - .github/workflows/cpu-image-check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpu-image-check
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only libraries
        run: |
          pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-cpu.txt
      - name: Generate an image without API credentials
        env:
          CPU_IMAGE_STEPS: '10'
        run: |
          python image_cpu.py --prompt 'ghibli style, hand-painted 2D animation, a young woman in a teal jacket beside a peaceful village school garden, watercolor hills, soft natural light' --output output/cpu-check.png
          python - <<'PY'
          from PIL import Image
          image = Image.open('output/cpu-check.png')
          assert image.size == (768, 432)
          assert image.convert('L').getextrema()[1] > 0
          print('Actual CPU-generated image passed size and nonblank checks')
          PY
# Generated images stay on the temporary runner, with no public artifacts.
# This verifies execution, not cinematic quality or character consistency.
