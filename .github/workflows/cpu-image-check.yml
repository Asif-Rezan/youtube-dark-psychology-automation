name: Free CPU image generation check
on:
  push:
    branches: [main]
    paths:
      - image_cpu.py
      - requirements-cpu.txt
      - video_packaging.py
      - thumbnail_design.py
      - history_topics.json
      - .github/workflows/cpu-image-check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpu-image-check
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only libraries
        run: |
          pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-cpu.txt
      - name: Generate episode-specific 3D storybook thumbnail
        env:
          CPU_IMAGE_STEPS: '24'
          HF_HUB_DISABLE_XET: '1'
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from PIL import Image
          from thumbnail_design import generate_thumbnail
          topic = next(t for t in json.loads(Path('history_topics.json').read_text())
                       if t['id'] == 'dark-psychology-influence')
          root = Path('output/thumbnail-preview')
          root.mkdir(parents=True, exist_ok=True)
          story = dict(title=topic['title_angle'],
                       thumbnail_prompt=topic['thumbnail_visual_story'],
                       thumbnail_text='WHO CONTROLS YOU?')
          (root/'episode.json').write_text(json.dumps(story, indent=2))
          target = generate_thumbnail(story, root, topic['id'])
          with Image.open(target) as image:
              assert image.size == (1280, 720)
              assert image.convert('L').getextrema()[1] > 0
              image.resize((320, 180)).save(root/'thumbnail-mobile.jpg')
          PYCODE
      - name: Save storybook thumbnail preview
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storybook-thumbnail-preview
          path: output/thumbnail-preview/
          retention-days: 7
          if-no-files-found: error
