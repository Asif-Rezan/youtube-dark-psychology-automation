name: Verify Google connections
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connections:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID || 'UCYjz7d66SsshimfpxZahlhQ' }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python verify_connections.py
      - name: Verify Facebook Page connection without publishing
        if: vars.FACEBOOK_PUBLISH_ENABLED == 'true'
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python - <<'PYFB'
          import os
          from facebook_publish import Facebook, FacebookError, PAGE_ID
          try:
              Facebook(os.getenv('FACEBOOK_PAGE_ACCESS_TOKEN')).verify_page()
          except FacebookError as error:
              print(str(error))
              raise SystemExit(1)
          print('Facebook Page verified: ' + PAGE_ID + '; uploads performed: false')
          PYFB
