name: Create and publish a rhyme Short
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: GitHub run containing the finished kids-video artifact
        type: string
        required: true
      run_id:
        description: Original song run ID inside that artifact
        type: string
        required: true
      clip_start:
        description: Start in seconds (0, 10, 20, etc.)
        type: number
        default: 0
      clip_seconds:
        description: Short duration
        type: choice
        options: ['20', '30', '40', '50']
        default: '40'
      upload_mode:
        description: Publication mode (requires PUBLISH_ENABLED)
        type: choice
        options: [scheduled, public]
        default: scheduled
  workflow_call:
    inputs:
      prepared_music:
        type: boolean
        default: false
      prepared_portraits:
        type: boolean
        default: false
      source_run:
        type: string
        required: true
      run_id:
        type: string
        required: true
      upload_mode:
        type: string
        default: scheduled
    secrets:
      YOUTUBE_TOKEN_JSON:
        required: true
      EXPECTED_CHANNEL_ID:
        required: true
      DRIVE_TOKEN_JSON:
        required: true
      DRIVE_FOLDER_ID:
        required: true
permissions:
  contents: read
  actions: read
# Manual and automatic publication share one lock and one durable checkpoint.
concurrency:
  group: dudi-dam-tv-shorts
  cancel-in-progress: false
jobs:
  short_music:
    if: ${{ !inputs.prepared_music }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      REFERENCE_AUDIO_PATH: assets/reference/style-reference.mp3
      CLIP_START: ${{ inputs.clip_start || 0 }}
      CLIP_SECONDS: ${{ inputs.clip_seconds || '40' }}
      SONG_RUN_ID: ${{ inputs.run_id }}
      ACESTEP_SOURCE_DIR: ${{ github.workspace }}/.vendor/ace-step
      ACESTEP_CHECKPOINTS_DIR: .models/acestep
      ACESTEP_INIT_LLM: 'false'
      ACESTEP_GENERATION_TIMEOUT: '18000'
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ace-step/ACE-Step-1.5
          ref: ca1e85fe9430179831e6bc6be790c332190a3866
          path: .vendor/ace-step
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Installs use --no-cache-dir; no pip cache exists to save at job teardown.
      - name: Prepare CPU runner memory and audio tools
        timeout-minutes: 10
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          bash scripts/install-runner-packages.sh ffmpeg libsndfile1
          sudo fallocate -l 16G /swapfile-music
          sudo chmod 600 /swapfile-music
          sudo mkswap /swapfile-music
          sudo swapon /swapfile-music
          free -h
          df -h .
      - name: Install CPU-only music inference runtime
        run: |
          pip install --no-cache-dir torch==2.10.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt -r requirements-music-cpu.txt
      - name: Verify pinned ACE-Step CPU imports
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from music_cpu import runtime
          torch, handler, params, config, infer = runtime(Path(os.environ['ACESTEP_SOURCE_DIR']))
          assert not torch.cuda.is_available()
          print('Pinned ACE-Step CPU runtime imported successfully')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: kids-video-${{ inputs.source_run }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: output/
      - name: Generate independent Shorts music
        run: python -u short_music.py --run-id "$SONG_RUN_ID" --start "$CLIP_START" --seconds "$CLIP_SECONDS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-music-${{ github.run_id }}
          path: |
            output/*/short-audio/**/*.wav
            output/*/short-audio/**/*.json
            output/*/short-audio/**/worker-resources.txt
          retention-days: 7
  short_images:
    name: Generate portraits only when not already prepared
    if: ${{ !inputs.prepared_portraits }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      IMAGE_SHARD: ${{ matrix.shard }}
      IMAGE_SHARDS: '4'
      IMAGE_VARIANT: portrait
      CLIP_START: ${{ inputs.clip_start || 0 }}
      CLIP_SECONDS: ${{ inputs.clip_seconds || '40' }}
      SONG_RUN_ID: ${{ inputs.run_id }}
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '3'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      CPU_IMAGE_WIDTH: '576'
      CPU_IMAGE_HEIGHT: '1024'
      CPU_IMAGE_STEPS: '20'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Installs use --no-cache-dir; no pip cache exists to save at job teardown.
      - name: Prepare CPU image memory
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo fallocate -l 12G /swapfile-images
          sudo chmod 600 /swapfile-images
          sudo mkswap /swapfile-images
          sudo swapon /swapfile-images
      - name: Install reference SSD-1B CPU image runtime
        run: |
          pip install --no-cache-dir torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt -r requirements-images-cpu.txt
      - uses: actions/download-artifact@v4
        with:
          name: kids-video-${{ inputs.source_run }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: output/
      - name: Generate native 9:16 Shorts illustrations
        run: |
          python -u - <<'PY'
          import json, os, re
          from pathlib import Path
          from song_images import generate_song_images
          run_id = os.environ['SONG_RUN_ID']
          if not re.fullmatch(r'[a-zA-Z0-9_-]{1,80}', run_id):
              raise SystemExit('Invalid song run ID')
          root = Path('output')/run_id
          generate_song_images(root, json.loads((root/'song.json').read_text()))
          PY
      - name: Prepare automatic character layers and animated scene clips
        run: |
          bash scripts/install-runner-packages.sh ffmpeg
          pip install --no-cache-dir -r requirements-motion-cpu.txt
          python -u character_motion.py --root "output/$SONG_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-artwork-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            output/*/portrait/*.png
            output/*/portrait/image-manifest-*.json
            output/*/portrait/characters/**
            output/*/portrait/motion/**
          retention-days: 7
  short:
    needs: [short_images, short_music]
    if: ${{ always() && !cancelled() && (needs.short_images.result == 'success' || needs.short_images.result == 'skipped') && (needs.short_music.result == 'success' || needs.short_music.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SONG_RUN_ID: ${{ inputs.run_id }}
      SOURCE_RUN: ${{ inputs.source_run }}
      CLIP_START: ${{ inputs.clip_start || 0 }}
      CLIP_SECONDS: ${{ inputs.clip_seconds || '40' }}
      UPLOAD_MODE: ${{ inputs.upload_mode }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Validate source and clip identity
        run: |
          python - <<'PY'
          import os, re
          from shorts import validate_clip
          if not re.fullmatch(r'[a-zA-Z0-9_-]{1,80}', os.environ['SONG_RUN_ID']):
              raise SystemExit('Invalid song run ID')
          if not re.fullmatch(r'[0-9]+', os.environ['SOURCE_RUN']):
              raise SystemExit('Invalid source GitHub run')
          validate_clip(int(os.environ['CLIP_START']), int(os.environ['CLIP_SECONDS']))
          PY
      - name: Install video tools
        timeout-minutes: 10
        run: |
          bash scripts/install-runner-packages.sh ffmpeg
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: kids-video-${{ inputs.source_run }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: output/
      - name: Download native portrait illustrations
        uses: actions/download-artifact@v4
        with:
          pattern: short-artwork-${{ inputs.prepared_portraits && inputs.source_run || github.run_id }}-*
          run-id: ${{ inputs.prepared_portraits && inputs.source_run || github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: output/
      - name: Download independent Shorts music
        uses: actions/download-artifact@v4
        with:
          name: short-music-${{ inputs.prepared_music && inputs.source_run || github.run_id }}
          run-id: ${{ inputs.prepared_music && inputs.source_run || github.run_id }}
          github-token: ${{ github.token }}
          path: output/
      - name: Render vertical Short with its own music
        run: python -u shorts.py --run-id "$SONG_RUN_ID" --start "$CLIP_START" --seconds "$CLIP_SECONDS"
      - uses: actions/upload-artifact@v4
        with:
          name: rhyme-short-${{ github.run_id }}
          path: output/shorts/
          retention-days: 7
      - name: Publish or verify the same Short
        if: vars.PUBLISH_ENABLED == 'true'
        run: python -u shorts.py --run-id "$SONG_RUN_ID" --start "$CLIP_START" --seconds "$CLIP_SECONDS" --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-publication-${{ github.run_id }}
          path: output/shorts/**/*.json
          retention-days: 7
