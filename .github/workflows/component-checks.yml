name: Cloud component checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
          pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-cpu.txt
      - name: Verify component tests with default settings
        run: python -m unittest -v
      - name: Verify component tests with daily production publishing settings
        env:
          YOUTUBE_PUBLICATION_MODE: scheduled
          FACEBOOK_PUBLISH_ENABLED: 'true'
          RUN_SCOPED_CLEANUP: 'true'
        run: python -m unittest -v
      - name: Verify real CPU narration without credentials
        run: python narration_check.py
