name: Clean previous dark psychology Drive files
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit first, or delete previous documentary files in this project's root
        type: choice
        options: [audit, delete]
        default: audit
permissions:
  contents: read
concurrency:
  group: legacy-dark-psychology-drive-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      CLEANUP_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inventory and clean only files directly in the verified old project folder
        run: |
          args=()
          if [[ "$CLEANUP_MODE" == "delete" ]]; then args+=(--delete); fi
          python -u legacy_drive_cleanup.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-cleanup-report-${{ github.run_id }}
          path: output/legacy-cleanup-report.json
          retention-days: 30
