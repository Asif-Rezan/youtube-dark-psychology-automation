name: AuK reference lyric edit preview
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: auk-reference-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Tencent-Hunyuan/AuK
          ref: 0d40366b1039e37c6cad008ab4713f6ad6d954b7
          path: .vendor/auk
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Prepare CPU memory and audio tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          bash scripts/install-runner-packages.sh ffmpeg libsndfile1
          sudo fallocate -l 32G /swapfile-auk
          sudo chmod 600 /swapfile-auk
          sudo mkswap /swapfile-auk
          sudo swapon /swapfile-auk
          free -h
          df -h .
      - name: Install CPU AuK runtime and source separation
        run: |
          pip install --no-cache-dir torch==2.7.1 torchaudio==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir ./.vendor/auk 'transformers==4.57.1' demucs==4.0.1 openai-whisper soundfile librosa 'huggingface-hub<1'
      - name: Download pinned AuK and encoder checkpoints
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download('tencent/AuK', revision='790742b71a4430120daf2b2099192abae449eb9f', local_dir='.models/auk', allow_patterns=['config.yaml','auk_base.safetensors','vae.safetensors'], max_workers=2)
          snapshot_download('Qwen/Qwen2.5-Omni-3B', revision='f75b40e3da2003cdd6e1829b1f420ca70797c34e', local_dir='.models/qwen', ignore_patterns=['*.md','*.png','*.jpg'], max_workers=2)
          PY
      - name: Edit one continuous minute and mix original backing
        run: python -u scripts/preview_auk.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auk-reference-60s
          path: output/auk-preview/
          retention-days: 7
